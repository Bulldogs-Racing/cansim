[package]
name = "cansimcan"
version = "0.1.0"
edition = "2021"
description = "CanLab — open-source visual CAN network & MCU simulator (CAN-first MVP)"
license = "MIT"
repository = "https://github.com/anomalyco/opencode"
keywords = ["can", "simulation", "embedded", "automotive"]
categories = ["simulation", "embedded"]

[[bin]]
name = "canlab"
path = "src/main.rs"

[lib]
name = "cansimcan"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "2"
tungstenite = "0.30.0"

[dev-dependencies]
# Test-only cross-validation for the §11 CRC-15 implementation: an
# independent, widely-used catalogue implementation (CRC_15_CAN).
crc = "3"
